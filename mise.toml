[settings]
lockfile = true

[tools]
actionlint = "1.7"
devcontainer-cli = "0.89"
go = "1.27"
"go:github.com/go-delve/delve/cmd/dlv" = "1.27"
"go:gotest.tools/gotestsum" = "1.13"
golangci-lint = "2.13"
goreleaser = "2.18"
node = "26.8"
"npm:markdown-link-check" = "3.15"
"npm:vite" = "8.2"
"npm:vitest" = "5.0"
pnpm = "11.25"
prettier = "3.9"
rumdl = "0.2"
shellcheck = "0.11"
typos = "1.50"

[tasks.'deps:wasm']
description = "download the dependencies for the wasm wrapper"
dir = "wasm"
run = '''
pnpm install
'''

[tasks.'deps:cli']
description = "download the dependencies for the cli"
run = '''
go mod download
'''

[tasks.'build:cli']
description = "build the cli"
usage = '''
flag "--ldflags <ldflags>" {
  help "linker flags"
  default "-s -w -extldflags \"-static\""
}
flag "--tags <tags>" {
  help "build tags"
  default "timetzdata"
}
'''
depends = ["deps:cli"]
run = '''
go build -ldflags "{{usage.ldflags}}" -tags "{{usage.tags}}" ./cmd/scw
'''

[tasks.'build:wasm']
description = "build the wasm wrapper"
depends = ["deps:wasm", "deps:cli"]
run = '''
GOOS=js GOARCH=wasm go build ./cmd/scw-wasm
mv scw-wasm wasm/cli.wasm
'''

[tasks.'build:wasm-tester']
description = "build the wasm wrapper tester"
depends = ["deps:wasm", "deps:cli"]
run = '''
GOOS=js GOARCH=wasm go build ./cmd/scw-wasm-tester
mv scw-wasm-tester wasm/cliTester.wasm
'''

[tasks.'build:doc']
description = "build the documentation"
depends = ["deps:cli"]
env = {
  SHELL="/bin/bash" # hardcoded here so the script uses it as default.
}
run = '''
go run ./cmd/scw-doc-gen
rumdl fmt -s ./docs
'''

[tasks.'lint:cli']
description = "lint the cli"
usage = '''
arg "[packages]" {
  help "target packages to test"
  default "./..."
}
'''
run = '''
golangci-lint run {{usage.packages}}
'''

[tasks.'lint:docker']
description = "lint the docker image"
run = '''
docker build --check .
'''

[tasks.'lint:wasm']
description = "lint the wasm wrapper"
depends = ["deps:wasm"]
dir = "wasm"
run = '''
prettier --check .
'''

[tasks.'lint:doc']
description = "lint the documentation"
depends = ["build:doc"]
run = '''
rumdl check ./docs
typos ./docs
'''

[tasks.'lint:actions']
description = "lint the workflows"
run = '''
actionlint
'''

[tasks.'test:cli']
description = "test the cli"
depends = ["build:cli"]
usage = '''
arg "[packages]" {
  help "target packages to test"
  default "./..."
}
'''
run = '''
gotestsum {{usage.packages}}
'''

[tasks.'test:cli:size']
description = "test the cli size"
depends = ["build:cli"]
usage = '''
flag "--binary <binary>" {
  default "./scw"
}
flag "--limit <limit>" {
  default "60000000"
}
'''
vars = {
  max_size = "100"
}
run = '''
size=$(wc -c < "{{usage.binary}}")
echo "binary size: $size bytes"
if [ "$size" -gt "{{usage.limit}}" ]
then
  echo "error: {{usage.binary}} exceeds {{usage.limit}} bytes"
  exit 1
fi
'''

[tasks.'test:wasm']
description = "test the wasm wrapper"
depends = ["build:wasm", "build:wasm-tester"]
dir = "wasm"
run = '''
vitest ./src
'''

# [tasks.'test:doc']
# description = "test the documentation"
# run = '''
# markdown-link-check -c ./.markdownlinkcheck.json -q ./docs
# '''

[tasks.ci]
description = ""
depends = ["test:**", "build:**", "lint:**"]

[tasks.release]
description = "release a new cli version"
usage = '''
flag "--snapshot <snapshot>" {
  help "only generate the snapshot and do not publish it"
  default "true"
}
flag "--clean <clean>" {
  help "cleanup the artifact directory before running"
  default "true"
}
'''
run = '''
goreleaser release --snapshot={{usage.snapshot}} --clean={{usage.clean}}
'''
