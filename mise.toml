[settings]
lockfile = true

[tools]
actionlint = "latest"
devcontainer-cli = "latest"
go = "latest"
"go:github.com/go-delve/delve/cmd/dlv" = "latest"
"go:gotest.tools/gotestsum" = "latest"
golangci-lint = "latest"
goreleaser = "latest"
node = "latest"
"npm:markdown-link-check" = "latest"
"npm:vite" = "latest"
"npm:vitest" = "latest"
pnpm = "latest"
prettier = "latest"
rumdl = "latest"
shellcheck = "latest"
typos = "latest"

[env]
MISE_CONFIG_ROOT="."
SHELL="/bin/bash" # hardcoded here so the doc generation script uses it as default.

[tasks.'deps:wasm']
description = "download the dependencies for the wasm wrapper"
dir = "wasm"
run = '''
pnpm install
'''

[tasks.'deps:cli']
description = "download the dependencies for the cli"
run = '''
go mod download
'''

[tasks.'build:cli']
description = "build the cli"
usage = '''
flag "--ldflags <ldflags>" {
  help "linker flags"
  default "-s -w"
}
'''
depends = ["deps:cli"]
run = '''
go build -ldflags "{{usage.ldflags}}" ./cmd/scw
'''

[tasks.'build:wasm']
description = "build the wasm wrapper"
depends = ["deps:wasm", "deps:cli"]
run = '''
GOOS=js GOARCH=wasm go build ./cmd/scw-wasm
mv scw-wasm wasm/cli.wasm
'''

[tasks.'build:wasm-tester']
description = "build the wasm wrapper tester"
depends = ["deps:wasm", "deps:cli"]
run = '''
GOOS=js GOARCH=wasm go build ./cmd/scw-wasm-tester
mv scw-wasm-tester wasm/cliTester.wasm
'''

[tasks.'build:doc']
description = "build the documentation"
depends = ["deps:cli"]
run = '''
go run ./cmd/scw-doc-gen
rumdl fmt -s ./docs
'''

[tasks.'lint:cli']
description = "lint the cli"
usage = '''
arg "[packages]" {
  help "target packages to test"
  default "./..."
}
'''
run = '''
golangci-lint run {{usage.packages}}
'''

[tasks.'lint:docker']
description = "lint the docker image"
run = '''
docker build --check .
'''

[tasks.'lint:wasm']
description = "lint the wasm wrapper"
depends = ["deps:wasm"]
dir = "wasm"
run = '''
prettier --check .
'''

[tasks.'lint:doc']
description = "lint the documentation"
depends = ["build:doc"]
run = '''
rumdl check ./docs
typos ./docs
'''

[tasks.'lint:actions']
description = "lint the workflows"
run = '''
actionlint
'''

[tasks.'test:cli']
description = "test the cli"
depends = ["build:cli"]
usage = '''
arg "[packages]" {
  help "target packages to test"
  default "./..."
}
'''
run = '''
gotestsum ${usage_packages}
'''

[tasks.'test:cli:size']
description = "test the cli size"
depends = ["build:cli"]
usage = '''
flag "--binary <binary>" {
  default "./scw"
}
flag "--limit <limit>" {
  default "60000000"
}
'''
vars = {
  max_size = "100"
}
run = '''
size=$(wc -c < "{{usage.binary}}")
echo "binary size: $size bytes"
if [ "$size" -gt "{{usage.limit}}" ]
then
  echo "error: {{usage.binary}} exceeds {{usage.limit}} bytes"
  exit 1
fi
'''

[tasks.'test:wasm']
description = "test the wasm wrapper"
depends = ["build:wasm", "build:wasm-tester"]
dir = "wasm"
run = '''
vitest ./src
'''

# [tasks.'test:doc']
# description = "test the documentation"
# run = '''
# markdown-link-check -c ./.markdownlinkcheck.json -q ./docs
# '''

[tasks.ci]
description = ""
depends = ["test:**", "build:**", "lint:**"]

[tasks.release]
description = "release a new cli version"
run = '''
false
'''
