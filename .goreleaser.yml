# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
force_token: github
before:
  hooks:
    - go mod download
    # We generate the flag file in the before hook, so that we can use it in blobs section
    - sh -c "echo {{ .Version }} > scw-cli-v2-version"

builds:
  - id: binaries
    env:
      - CGO_ENABLED=0
    main: ./cmd/scw/main.go
    binary: scaleway-cli
    goos:
      - freebsd
      - linux
      - windows
      - darwin
    goarch:
      - 386
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: 386
    flags:
      - -tags=timetzdata
      - -trimpath
    ldflags:
      - -s
      - -w
      - -extldflags "-static"
      - -X main.Version={{ .Version }}
      - -X main.BuildDate={{ .Date }}
      - -X main.GitBranch={{ .Branch }}
      - -X main.GitCommit={{ .ShortCommit }}

archives:
  - id: binaries
    formats:
      - binary
    format_overrides:
      # Windows ships as zip instead of a raw .exe: the chocolatey package
      # (.goreleaser.chocolatey.yml) installs from this zip, and winget skips
      # silently when both .exe and .zip exist for the same target.
      - goos: windows
        formats:
          - zip

nfpms:
  - formats: [deb, rpm]
    maintainer: Scaleway Devtools <opensource@scaleway.com>

checksum:
  name_template: 'SHA256SUMS'
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

dockers_v2:
  - images:
      - "scaleway/cli"
    tags:
      # Only stable tags may claim latest/major/minor: a prerelease or debug
      # tag (v1.2.3-alpha1, v1.2.3-dbg1) must not overwrite the last stable
      # image. GoReleaser drops a tag that renders to an empty string.
      - '{{ if not .Prerelease }}latest{{ end }}'
      - "{{ .Tag }}"
      - '{{ if not .Prerelease }}{{ .Major }}{{ end }}'
      - '{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}'
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: true
    build_args:
      VERSION: "{{ .Version }}"
    labels:
      io.modelcontextprotocol.server.name: "io.github.scaleway/scaleway-mcp"

mcp:
  name: "io.github.scaleway/scaleway-mcp"
  title: "Scaleway MCP server"
  description: "Scaleway MCP server for interacting with the Scaleway APIs"
  homepage: "https://cli.scaleway.com/"
  auth:
    type: github-oidc
    token: "{{ .Env.GITHUB_TOKEN }}"
  repository:
    url: "https://github.com/scaleway/scaleway-cli"
    source: github
    id: "32575663"
    subfolder: internal/namespaces/mcp
  packages:
    - registry_type: oci
      identifier: "scaleway/cli:{{ .Version }}"
      transport:
        type: stdio

release:
  github:
    owner: scaleway
    name: scaleway-cli

  # If set to auto, will mark the release as not ready for production
  # in case there is an indicator for this in the tag e.g. v1.0.0-rc1
  # If set to true, will mark the release as not ready for production.
  prerelease: auto
  draft: true
  name_template: "{{ .Tag }}"
  # The separate "publish" workflow (release: published) re-runs goreleaser to
  # push docker/mcp/winget; it sets DISABLE_RELEASE so this run never touches the
  # (now immutable) GitHub release again.
  disable: "{{ .Env.DISABLE_RELEASE }}"

winget:
  - name: cli
    publisher: Scaleway SAS
    short_description: Command Line Interface for Scaleway
    package_identifier: "Scaleway.cli"
    license: Apache-2.0
    author: Scaleway
    copyright: Copyright (c) Scaleway SAS
    publisher_url: https://www.scaleway.com/en/
    publisher_support_url: https://www.scaleway.com/en/docs/
    license_url: https://github.com/scaleway/scaleway-cli/blob/main/LICENSE
    release_notes_url: https://github.com/scaleway/scaleway-cli/releases/tag/{{ .Tag }}
    release_notes: "{{ .Changelog }}"
    skip_upload: auto
    repository:
      owner: scaleway
      name: winget-pkgs
      branch: "{{ .ProjectName }}-{{ .Version }}"
      token: "{{ .Env.WINGET_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
    tags:
      - golang
      - cli
      - go
      - scaleway
      - scaleway-cli
      - scw
