","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":52588544,"digest":"sha256:302e627d53031519cd2234681c9f7b5a71fbd87a95c01b0724d422916da8f7d0","download_count":5,"created_at":"2026-10-06T09:05:10Z","updated_at":"2026-10-06T09:05:15Z","browser_download_url":"https://github.com/scaleway/scaleway-cli/releases/download/v2.64.0/scaleway-cli_2.64.0_windows_arm64.exe"},{"url":"https://api.github.com/repos/scaleway/scaleway-cli/releases/assets/615020238","id":615020238,"node_id":"RA_kwDOAfEQr84kqHbO","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","avatar_url":"https://avatars.githubusercontent.com/in/15368?v=4","gravatar_id":"","url":"https://api.github.com/users/github-actions%5Bbot%5D","html_url":"https://github.com/apps/github-actions","followers_url":"https://api.github.com/users/github-actions%5Bbot%5D/followers","following_url":"https://api.github.com/users/github-actions%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/github-actions%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/github-actions%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/github-actions%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/github-actions%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/github-actions%5Bbot%5D/repos","events_url":"https://api.github.com/users/github-actions%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/github-actions%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1706,"digest":"sha256:27c86c113a79861bae4e7ab5f0d5f8435d8e19ade764cfd5e192d8c158296dfb","download_count":45,"created_at":"2026-10-06T09:05:14Z","updated_at":"2026-10-06T09:05:14Z","browser_download_url":"https://github.com/scaleway/scaleway-cli/releases/download/v2.64.0/SHA256SUMS"}],"tarball_url":"https://api.github.com/repos/scaleway/scaleway-cli/tarball/v2.64.0","zipball_url":"https://api.github.com/repos/scaleway/scaleway-cli/zipball/v2.64.0","body":"## Breaking\r\n\r\nThe docker image has been changed from an alpine-based image to a scratch image with v1.63.\r\n\r\n## Changelog\r\n* 716abfc1f92608a0edfc387e65569f3b0d0025eb: ci(nightly): use the correct variables for the notification text (#6352) (Romain Baugue <rbaugue@scaleway.com>)\r\n\r\n## What''s Changed\r\n* chore(deps): bump github.com/aws/smithy-go from 1.28.1 to 1.28.2 by @dependabot[bot] in https://github.com/scaleway/scaleway-cli/pull/6284\r\n* fix(announce): add missing remplacement marks for the announcement me… by @elwinar in https://github.com/scaleway/scaleway-cli/pull/6287\r\n* feat(rdb): add config get command to generate database client snippets by @jremy42 in https://github.com/scaleway/scaleway-cli/pull/5644\r\n* chore(deps): bump github.com/containerd/containerd/v2 from 2.3.5 to 2.3.6 by @dependabot[bot] in https://github.com/scaleway/scaleway-cli/pull/6283\r\n* chore(deps): bump github.com/aws/aws-sdk-go-v2/service/s3 from 1.113.1 to 1.113.2 by @dependabot[bot] in https://github.com/scaleway/scaleway-cli/pull/6301\r\n* chore: support more flags for the build and test tasks of the cli by @elwinar in https://github.com/scaleway/scaleway-cli/pull/6302\r\n* docs(billing): update doc to be more explicit of the specified currency by @scaleway-bot in https://github.com/scaleway/scaleway-cli/pull/6288\r\n* chore(k8s): remove userdata from CLI resources and migrate commands to pool resource by @scaleway-bot in https://github.com/scaleway/scaleway-cli/pull/6303\r\n* test(baremetal): select the best offer for servers based on filters by @elwinar in https://github.com/scaleway/scaleway-cli/pull/6307\r\n* fix: Correct `scripts/get.sh` for ambiguous file extension by @elwinar in https://github.com/scaleway/scaleway-cli/pull/6311\r\n* feat(mongodb): add support for create user in v1 by @scaleway-bot in https://github.com/scaleway/scaleway-cli/pull/6314\r\n* fix(instance): handle stopped_in_place by @remyleone in https://github.com/scaleway/scaleway-cli/pull/6313\r\n* feat(autoscaling): add support for refresh group by @scaleway-bot in https://github.com/scaleway/scaleway-cli/pull/6309\r\n* docs(containers): change documentation about private endpoint by @scaleway-bot in https://github.com/scaleway/scaleway-cli/pull/6315\r\n* chore(deps-dev): bump vite from 8.2.2 to 8.3.0 in /wasm by @dependabot[bot] in https://github.com/scaleway/scaleway-cli/pull/6317\r\n* chore(deps): bump github.com/aws/aws-sdk-go-v2/service/s3 from 1.113.2 to 1.113.3 by @dependabot[bot] in https://github.com/scaleway/scaleway-cli/pull/6318\r\n* chore(deps-dev): bump prettier from 3.9.6 to 3.9.9 in /wasm by @dependabot[bot] in https://github.com/scaleway/scaleway-cli/pull/6319\r\n* feat(search): add support for `wofl_run` and `wofl_definition` by @scaleway-bot in https://github.com/scaleway/scaleway-cli/pull/6320\r\n* chore(secret): fix test helper by @estellesoulard in https://github.com/scaleway/scaleway-cli/pull/6328\r\n* chore(deps): bump github.com/aws/aws-sdk-go-v2 from 1.47.0 to 1.47.1 by @dependabot[bot] in https://github.com/scaleway/scaleway-cli/pull/6327\r\n* feat(instance): migrate placement-group resource to API v2 by @Mia-Cross in https://github.com/scaleway/scaleway-cli/pull/6132\r\n* chore(deps): bump github.com/aws/aws-sdk-go-v2/service/s3 from 1.113.3 to 1.113.4 by @dependabot[bot] in https://github.com/scaleway/scaleway-cli/pull/6326\r\n* feat(search): add wofl product to catalog and search by @scaleway-bot in https://github.com/scaleway/scaleway-cli/pull/6322\r\n* ci: generate the cover profile in the mise ci task by @elwinar in https://github.com/scaleway/scaleway-cli/pull/6337\r\n* feat(k8s): add max_termination_grace_period to internal pool API by @scaleway-bot in https://github.com/scaleway/scaleway-cli/pull/6332\r\n* build(core): replace the deps management tasks with the mise native p… by @elwinar in https://github.com/scaleway/scaleway-cli/pull/6340\r\n* feat(kafka): expose CreateEndpoint and DeleteEndpoint CLI commands by @scaleway-bot in https://github.com/scaleway/scaleway-cli/pull/6334\r\n* ci(cache): improve cache handling to speed-up ci run times by @elwinar in https://github.com/scaleway/scaleway-cli/pull/6343\r\n* feat(k8s): add support for loading cloudinit using a local file by @remyleone in https://github.com/scaleway/scaleway-cli/pull/6330\r\n* ci: improve workflows notifications, logs, and caching by @elwinar in https://github.com/scaleway/scaleway-cli/pull/6349\r\n* chore(iam): remove unused  column from api-key listing by @estellesoulard in https://github.com/scaleway/scaleway-cli/pull/6351\r\n* ci(nightly): use the correct variables for the notification text by @elwinar in https://github.com/scaleway/scaleway-cli/pull/6352\r\n\r\n\r\n**Full Changelog**: https://github.com/scaleway/scaleway-cli/compare/v2.63.0...v2.64.0","mentions_count":7}'
