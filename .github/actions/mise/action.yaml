name: mise
inputs:
  cache:
    default: true
  cache_save:
    default: false
runs:
  using: "composite"
  steps:
    - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      with:
        version: 2026.11.9
        cache: ${{ inputs.cache }}
        cache_save: ${{ inputs.cache_save }}
        experimental: true
