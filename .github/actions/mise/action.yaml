name: mise
inputs:
  cache:
    default: true
  cache_save:
    default: false
runs:
  using: "composite"
  steps:
    - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        version: 2026.11.0
        cache: ${{ inputs.cache }}
        cache_save: ${{ inputs.cache_save }}
        experimental: true
