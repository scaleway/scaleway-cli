name: Nightly Acceptance Tests

permissions:
  contents: read

on:
  schedule:
    # Will run at 00:00 every day
    - cron: "0 0 * * *"

jobs:
  nightly:
    strategy:
      fail-fast: false
      matrix:
        products:
          - account
          - applesilicon
          - autoscaling
          - baremetal
          - billing
          - block
          - cockpit
          - container
          - dedibox
          - domain
          - edge_services
          - flexibleip
          - function
          - iam
          - inference
          - init
          - instance
          - iot
          - ipam
          - jobs
          - k8s
          - key_manager
          - lb
          - login
          - marketplace
          - mnq
          - mongodb
          - object
          - rdb
          - redis
          - registry
          - serverless_sqldb
          - secret
          - tem
          - vpc
          - vpcgw
          - webhosting
    runs-on: "${{ vars.RUNS_ON || 'ubuntu-latest' }}"
    steps:
      - name: Set git to use LF to avoid problem with goldens on windows
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: jdx/mise-action@v3
        with:
          version: 2026.9.3
      - name: Run Acceptance Tests
        run: mise run test:cli --format github-actions --timeout 4h --cassettes --goldens --debug ./internal/namespaces/${{ matrix.products }}/...
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      - name: Ping on failure
        uses: slackapi/slack-github-action@v4.0.0
        if: ${{ failure() }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_NIGHTLY }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "Scaleway CLI Nightly workflow failed: <https://github.com/scaleway/scaleway-cli/actions/runs/${{ GITHUB_RUN_ID }}|${{ matrix.product }}>"

  sweepers:
    runs-on: "${{ vars.RUNS_ON || 'ubuntu-latest' }}"
    needs: nightly
    if: always()
    steps:
      - name: Set git to use LF to avoid problem with goldens on windows
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: jdx/mise-action@v3
        with:
          version: 2026.9.3
      - name: Run Sweepers
        run: go run -v ./cmd/scw-sweeper
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      - name: Ping on failure
        uses: slackapi/slack-github-action@v4.0.0
        if: ${{ failure() }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_NIGHTLY }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "Scaleway CLI sweepers in Nightly workflow failed: <https://github.com/scaleway/scaleway-cli/actions/runs/${{GITHUB_RUN_ID}}>"
