name: release
permissions:
  contents: write

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: $/.github/actions/checkout
      - uses: $/.github/actions/mise
        with:
          cache: false
      - name: Create the draft release
        # Builds everything and uploads binaries to a draft GitHub release. The
        # package feeds (docker, mcp, winget, chocolatey) are only touched by
        # publish.yml once the draft has been manually reviewed and published.
        run: mise run release --no-snapshot --skip docker,mcp,winget
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
