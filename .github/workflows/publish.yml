name: publish

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  publish:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      id-token: write # Required for OIDC (MCP)
    steps:
      - uses: $/.github/actions/checkout
      - uses: $/.github/actions/mise
        with:
          cache: false
      - name: Login to DockerHub Registry
        run: echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
      - name: Push the packages (docker, mcp, winget)
        # Runs once the draft release is manually published. DISABLE_RELEASE
        # makes GoReleaser skip the now-immutable GitHub release: this run only
        # pushes docker, mcp and winget.
        run: mise run release --no-snapshot
        env:
          DISABLE_RELEASE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

  chocolatey:
    # GoReleaser shells out to the Windows-only `choco` binary, so the
    # chocolatey package is built and pushed on a windows runner, using its own
    # config (.goreleaser.chocolatey.yml) instead of the main one.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: $/.github/actions/checkout
      - uses: $/.github/actions/mise
        with:
          cache: false
      - name: Publish the Chocolatey packages
        # mise cannot install chocolatey (a multi-file app distributed as an
        # MSI), so rely on the choco preinstalled on the windows runner.
        run: goreleaser release -f .goreleaser.chocolatey.yml --clean
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}

  slack:
    permissions:
      contents: read
    runs-on: "${{ vars.RUNS_ON || 'ubuntu-latest' }}"
    steps:
      - name: Announce on slack
        env:
          TAG_NAME: "${{ github.event.release.tag_name }}"
          HTML_URL: "${{ github.event.release.html_url }}"
          WEBHOOKS: "${{ secrets.SLACK_WEBHOOKS }}"
        run: |
          for webhook in $WEBHOOKS; do
            jq -n --arg tag_name "$TAG_NAME" --arg html_url "$HTML_URL" '{
              "blocks": [
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "New CLI release \($tag_name) ! :tada: :rocket:\nCheck changelog on <\($html_url)|release page>"
                    }
                }
              ]
            }' | curl -X POST -H 'Content-type: application/json' -d @- "$webhook"
          done
