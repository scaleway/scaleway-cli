name: ci

on:
  merge_group:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  code-quality: write

jobs:
  ci:
    runs-on: "${{ vars.RUNS_ON || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Set git to use LF to avoid problem with goldens on windows
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set cache paths
        run: |
          echo "GOMODCACHE=$HOME/.cache/go-mod" >> "$GITHUB_ENV"
          echo "GOCACHE=$HOME/.cache/go-build" >> "$GITHUB_ENV"
          echo "PNPM_HOME=$HOME/.cache/pnpm-store" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: go-mod-cache
        name: Restore go module cache
        with:
          path: ${{ env.GOMODCACHE }}
          key: go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: go-build-cache
        name: Restore go build cache
        with:
          path: ${{ env.GOCACHE }}
          key: go-build-${{ runner.os }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pnpm-store-cache
        name: Restore pnpm store cache
        with:
          path: ${{ env.PNPM_HOME }}/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.3
          cache: true
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          experimental: true
      - run: mise run ci --coverprofile cover.out
      - name: Generate coverage report
        run: |
          gocover-cobertura < cover.out > cover.xml
      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
        with:
          file: cover.xml
          language: Go
          label: cli
      - name: Save go module cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOMODCACHE }}
          key: go-mod-${{ hashFiles('**/go.sum') }}
      - name: Save go build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOCACHE }}
          key: go-build-${{ runner.os }}
      - name: Save pnpm store cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_HOME }}/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
